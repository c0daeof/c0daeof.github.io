<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Precision Resistance Processor</title>
    <style>
        :root {
            --panel-color: #222426;
            --input-bg: #151617;
            --text-dim: #666;
            --text-bright: #e0e0e0;
            --accent: #ff4d00; /* Цвет "индикаторный оранжевый" */
        }

        body {
            background-color: #121314;
            color: var(--text-bright);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Основная панель */
        .console {
            background: var(--panel-color);
            width: 100%;
            max-width: 480px;
            padding: 50px;
            border-radius: 2px;
            box-shadow: 
                0 40px 100px rgba(0,0,0,0.8),
                inset 0 1px 1px rgba(255,255,255,0.05);
            position: relative;
        }

        /* Тонкая гравировка заголовка */
        header {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 40px;
            border-left: 2px solid var(--accent);
            padding-left: 15px;
            line-height: 1;
        }

        .row {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        /* Утопленные инпуты с мягкой тенью */
        input {
            width: 100%;
            box-sizing: border-box;
            background: var(--input-bg);
            border: none;
            border-radius: 1px;
            padding: 14px;
            color: var(--accent);
            font-family: 'IBM Plex Mono', 'Menlo', monospace;
            font-size: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            outline: none;
            transition: box-shadow 0.3s;
        }

        input:focus {
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 1px rgba(255,77,0,0.5);
        }

        .grid-targets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .grid-targets input {
            padding: 10px;
            font-size: 13px;
            text-align: center;
        }

        /* Кнопка "вровень" с поверхностью */
        button {
            width: 100%;
            background: #2a2c2e;
            border: 1px solid #333;
            color: var(--text-bright);
            padding: 18px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            border-radius: 1px;
        }

        button:hover {
            background: #333;
            border-color: var(--accent);
        }

        button:active {
            background: #111;
            transform: translateY(1px);
        }

        /* Секция вывода как часть панели */
        #output {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-top: 1px solid #333;
            padding-top: 30px;
        }

        .res-item {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
        }

        .res-item span:last-child {
            color: var(--text-bright);
        }

        /* Маленький индикатор работы */
        .led {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
            transition: background 0.3s;
        }

        .led.active {
            background: var(--accent);
            box-shadow: 0 0 5px var(--accent);
        }
    </style>
</head>
<body>

<div class="console">
    <header>Resistance Module <span id="status-led" class="led"></span></header>

    <div class="row">
        <label>Primary Voltage (V_in)</label>
        <input type="number" id="v_in" placeholder="00.00" step="0.1">
    </div>

    <div class="row">
        <label>Voltage Targets (7ch)</label>
        <div class="grid-targets" id="targets-container">
            </div>
    </div>

    <button onclick="compute()">Run Calculation</button>

    <div id="output">
        </div>
</div>

<script>
    const container = document.getElementById('targets-container');
    const rBase = 10000; // Базовое сопротивление (10k)

    for (let i = 1; i <= 7; i++) {
        container.innerHTML += `<input type="number" class="v-target" placeholder="V${i}" step="0.01">`;
    }

    function compute() {
        const led = document.getElementById('status-led');
        const vIn = parseFloat(document.getElementById('v_in').value);
        const targets = document.querySelectorAll('.v-target');
        const outDiv = document.getElementById('output');

        if (!vIn) return;

        led.classList.add('active');
        outDiv.innerHTML = '';

        targets.forEach((input, i) => {
            const vOut = parseFloat(input.value);
            if (vOut) {
                const rVal = (vOut >= vIn) ? 'OVER' : ((vOut * rBase) / (vIn - vOut)).toFixed(0);
                outDiv.innerHTML += `
                    <div class="res-item">
                        <span>R${i+1} (${vOut}V)</span>
                        <span>${rVal} Ω</span>
                    </div>
                `;
            }
        });

        setTimeout(() => led.classList.remove('active'), 500);
    }
</script>

</body>
</html>
